[theme]
base = "light"
primaryColor = "#0891b2"
backgroundColor = "#f5f8fb"
secondaryBackgroundColor = "#eef3f7"
textColor = "#0f1b2d"
linkColor = "#0e7490"
borderColor = "#dbe4ec"
dataframeBorderColor = "#e3eaf0"
dataframeHeaderBackgroundColor = "#f1f5f9"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showSidebarBorder = true
# Validated on white (dataviz validator): blue, orange, aqua, yellow, magenta, green, violet, red.
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
# One-hue blue ramp, light (low) to dark (high).
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#1c5cab", "#104281"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f1b2d"
primaryColor = "#0891b2"
borderColor = "#dbe4ec"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
# Megabytes per file: the most a free Supabase project accepts, and small enough to check in the app's memory.
maxUploadSize = 50
enableStaticServing = true
# Map.py reloads the geotech modules itself, under one lock, when their files change. Streamlit's own reloader would
# unload them from other visitors' runs at any moment, so it is told to leave that folder alone.
folderWatchBlacklist = ["**/geotech"]
